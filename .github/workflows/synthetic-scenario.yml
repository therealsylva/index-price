name: Market OHLCV history
on:
  pull_request:
    paths:
      - tools/project_market_history.py
      - tests/test_project_market_history.py
      - .github/workflows/synthetic-scenario.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scenario:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p 'test_project_market_history.py'
      - run: python3 tools/project_market_history.py --output scenario --generated-at 2026-11-01T19:00:00Z
      - uses: actions/upload-artifact@v4
        with:
          name: BlackBook-market-OHLCV-through-2026-12-30
          path: scenario/
